<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 68" fill="none" role="img" aria-label="Polat Dekorasyon Logo">
  <defs>
    <linearGradient id="navyBox" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#132B4B"/>
      <stop offset="100%" stop-color="#091628"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F2B21B"/>
      <stop offset="100%" stop-color="#D99407"/>
    </linearGradient>
  </defs>
  <!-- Emblem Box -->
  <rect x="2" y="2" width="64" height="64" rx="15" fill="url(#navyBox)" stroke="#F2B21B" stroke-opacity="0.38" stroke-width="1.5"/>
